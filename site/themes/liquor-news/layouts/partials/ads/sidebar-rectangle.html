<!-- AD SLOT: Sidebar Rectangle - 300x250 sidebar ad, reads from site.Params.ads.sidebar_rectangle -->
{{ if .Site.Params.ads.sidebar_rectangle }}
  <div class="ad-sidebar-rectangle">
    {{ if .Site.Params.ads.sidebar_rectangle.html }}
      {{ .Site.Params.ads.sidebar_rectangle.html | safeHTML }}
    {{ else if .Site.Params.ads.sidebar_rectangle.image }}
      <img
        src="{{ .Site.Params.ads.sidebar_rectangle.image }}"
        alt="{{ .Site.Params.ads.sidebar_rectangle.alt | default "Advertisement" }}"
        class="ad-image"
        loading="lazy"
      >
    {{ else }}
      <div class="ad-placeholder">
        <p>Advertisement</p>
        <p class="ad-placeholder-size">300 x 250</p>
      </div>
    {{ end }}
  </div>
{{ end }}

<style>
.ad-sidebar-rectangle {
  width: 300px;
  height: 250px;
  background-color: #f9f9f9;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ad-sidebar-rectangle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.ad-sidebar-rectangle iframe {
  width: 300px;
  height: 250px;
  border: none;
}

.ad-placeholder {
  text-align: center;
  padding: 2rem 1rem;
}

.ad-placeholder p {
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  color: #999;
  margin: 0;
}

.ad-placeholder-size {
  font-size: 0.8rem;
  margin-top: 0.5rem !important;
}

@media (max-width: 1024px) {
  .ad-sidebar-rectangle {
    width: 100%;
    max-width: 300px;
  }

  .ad-sidebar-rectangle iframe {
    width: 100%;
    max-width: 300px;
  }
}

@media (max-width: 768px) {
  .ad-sidebar-rectangle {
    max-width: 100%;
    height: auto;
    aspect-ratio: 300 / 250;
  }

  .ad-sidebar-rectangle iframe {
    width: 100%;
    height: auto;
  }
}
</style>
