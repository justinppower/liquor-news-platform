name: RSS Feed Aggregator

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install feedparser requests python-dateutil

      - name: Fetch RSS feeds
        run: |
          python site/scripts/rss-fetch.py

      - name: Check for new content
        id: check-changes
        run: |
          git diff --quiet site/content/ site/data/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push new content
        if: steps.check-changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "RSS Bot"
          git config user.email "rss-bot@liquornewsusa.com"
          git add site/content/ site/data/
          git commit -m "Auto: RSS feed update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Trigger site deploy
        if: steps.check-changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
