name: RSS Aggregate (Daily)

on:
  schedule:
    # 06:00 UTC = 01:00 ET = 03:00 SAST
    - cron: '0 6 * * *'
    # 18:00 UTC = 13:00 ET = midday refresh
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  aggregate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run aggregator
        run: |
          chmod +x scripts/aggregate.py
          python scripts/aggregate.py
          echo "Aggregator produced $(find _build -type f | wc -l) files"

      - name: Build bundle
        run: |
          cd _build
          tar -czf ../site.tgz .
          cd ..
          base64 -w0 site.tgz > site-bundle.b64
          ls -lh site-bundle.b64

      - name: Commit bundle (skip if no change)
        run: |
          git config user.name "Package Store Bot"
          git config user.email "bot@packagestoretx.com"
          git add site-bundle.b64
          if git diff --staged --quiet; then
            echo "No bundle changes to commit"
          else
            git commit -m "rss: daily aggregation $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
